name: Auto Assign
on:
  issues:
    types: [opened, reopened, ready_for_review]
  pull_request:
    types: [opened, reopened, ready_for_review]
jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto-assign issues and pull requests
        uses: toshimaru/auto-assign-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Hordekiller, Maddyrampant
          reviewers: Hordekiller, Maddyrampant
          numberOfAssignees: 2
          numberOfReviewers: 1
          skipAuthors: false
